services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: readion
      POSTGRES_PASSWORD: readion
      POSTGRES_DB: readion
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U readion -d readion']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 5

  scrapper:
    image: amerkurev/scrapper:latest@sha256:81b32d7f282ff298e1c4413f6374e5806c41e7fc757c89940032b0e952111ede
    ports:
      - '3000:3000'
    environment:
      - BROWSER_DISABLE_DEV_SHM=true
    # The scrapper sidecar provides web-page-to-text conversion for the worker.
    # Integration tests that need HTTP scraping should target this service.
    # Testcontainers-based tests mock the scrapper HTTP client directly.

volumes:
  postgres_data:
  redis_data:
