name: outside-in-tdd
version: 1
description: Outside-In TDD workflow — acceptance tests drive implementation from the outside in. Specs define acceptance test scenarios; design defines mock boundaries; tasks enforce RED → GREEN → REFACTOR from outermost layer inward.
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      You are a senior engineer practicing strict outside-in TDD.
      Create the proposal document that establishes WHY this change is needed.


      Sections:

      - **Why**: 1-2 sentences on the problem or opportunity. What problem does
      this solve? Why now?

      - **What Changes**: Bullet list of changes. Be specific about new
      capabilities, modifications, or removals. Mark breaking changes with
      **BREAKING**.

      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `openspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.


      IMPORTANT: The Capabilities section is critical. It creates the contract
      between proposal and specs phases. Research existing specs before filling
      this in. Each capability listed here will need a corresponding spec file.


      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.


      This is the foundation - specs, design, and tasks all build on this.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications — each scenario is a concrete acceptance test case
    template: spec.md
    instruction: >
      You are a senior engineer practicing strict outside-in TDD.
      Create specification files that define WHAT the system should do.
      In this outside-in TDD workflow, every scenario you write IS an acceptance
      test case. Write them as if a test runner will execute them — concrete
      inputs, observable outputs, no ambiguity.


      Create one spec file per capability listed in the proposal's Capabilities
      section.

      - New capabilities: use the exact kebab-case name from the proposal
      (specs/<capability>/spec.md).

      - Modified capabilities: use the existing spec folder name from
      openspec/specs/<capability>/ when creating the delta spec at
      specs/<capability>/spec.md.


      Delta operations (use ## headers):

      - **ADDED Requirements**: New capabilities

      - **MODIFIED Requirements**: Changed behavior - MUST include full updated
      content

      - **REMOVED Requirements**: Deprecated features - MUST include **Reason**
      and **Migration**

      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format


      Format requirements:

      - Each requirement: `### Requirement: <name>` followed by description

      - Use SHALL/MUST for normative requirements (avoid should/may)

      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format

      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3
      hashtags or bullets will fail silently.

      - Every requirement MUST have at least one scenario.

      - Scenarios must be concrete: name specific inputs, exact outputs, and
      observable side effects. Vague scenarios ("WHEN it works THEN it succeeds")
      are not acceptable — they cannot be turned into tests.


      MODIFIED requirements workflow:

      1. Locate the existing requirement in openspec/specs/<capability>/spec.md

      2. Copy the ENTIRE requirement block (from `### Requirement:` through all
      scenarios)

      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior

      4. Ensure header text matches exactly (whitespace-insensitive)


      Common pitfall: Using MODIFIED with partial content loses detail at
      archive time. If adding new concerns without changing existing behavior,
      use ADDED instead.


      Example:

      ```

      ## ADDED Requirements


      ### Requirement: User can export data

      The system SHALL allow users to export their data in CSV format.


      #### Scenario: Successful export

      - **WHEN** user requests export with valid session token

      - **THEN** system returns a 200 response with Content-Type text/csv

      - **THEN** the CSV contains one row per user record, comma-delimited


      ## REMOVED Requirements


      ### Requirement: Legacy export

      **Reason**: Replaced by new export system

      **Migration**: Use new export endpoint at /api/v2/export

      ```
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design document — includes test boundaries defining what is mocked vs real
    template: design.md
    instruction: >
      You are a senior engineer practicing strict outside-in TDD.
      Create the design document that explains HOW to implement the change and
      WHERE the test boundaries sit.


      In this outside-in TDD workflow, the most important section is
      **Test Boundaries**. It must be written before tasks.md, because it defines
      which dependencies are mocked in the acceptance test and which are real.
      Without this, the acceptance test cannot be written.


      When to include design.md (create only if any apply):

      - Cross-cutting change (multiple services/modules) or new architectural
      pattern

      - New external dependency or significant data model changes

      - Security, performance, or migration complexity

      - Ambiguity that benefits from technical decisions before coding


      Sections:

      - **Context**: Background, current state, constraints, stakeholders

      - **Goals / Non-Goals**: What this design achieves and explicitly excludes

      - **Test Boundaries** (REQUIRED in this schema): For each external
      dependency or collaborator, state whether it is mocked or real in tests,
      and at what layer (HTTP, module boundary, DB, etc.). Format as a table:
        | Dependency | In acceptance test | In unit tests |
        |---|---|---|
        | Sentry API | HTTP mock (nock) | HTTP mock |
        | Postgres | real (test DB) | real (test DB) |

      - **Decisions**: Key technical choices with rationale (why X over Y?).
      Include alternatives considered for each decision.

      - **Risks / Trade-offs**: Known limitations, things that could go wrong.
      Format: [Risk] → Mitigation

      - **Open Questions**: Outstanding decisions or unknowns to resolve


      **Frontend/UI changes — capture the visual design source.** When this
      change builds or modifies user-facing views, the visual source of truth
      lives in the team's Claude Design project(s) at claude.ai/design, reachable
      via the DesignSync tool (`list_projects`, `list_files`, `get_file`). Do the
      following so the actual designed views are pulled into the change rather
      than reinvented:

      - Confirm the design connector is reachable. If it needs authorization,
      tell the user to run `/design-login` before continuing.

      - Identify which screens/views THIS change owns and import ONLY those:
      read each relevant file via DesignSync `get_file` and save it into the
      change at `design/<view>.html`. Leave screens owned by other changes to
      their own changes — do not bulk-import the whole project.

      - Add a **Visual Design** section to design.md with a table mapping each
      imported artboard/screen to the page/view/component it drives, and call out
      the shared layout(s) to build once and reuse.

      - Add a **Design ↔ contract reconciliation** subsection. The mockups are
      usually drawn ahead of the implemented API/spec, so list every place the
      design diverges from the real backend/contract — extra or missing fields,
      omitted states, wrong copy or TTLs, and especially security-sensitive
      disclosures — and state how each resolves. The behavioral specs always win;
      record what to keep from the design and what to drop or adjust.

      - If the change is non-UI, or no design source exists for these views, say
      so explicitly and skip this section rather than inventing one.


      Focus on architecture and approach, not line-by-line implementation.

      Reference the proposal for motivation and specs for requirements.
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Outside-in TDD task list — acceptance test first, then inner units, RED→GREEN→REFACTOR throughout
    template: tasks.md
    instruction: >
      You are a senior engineer practicing strict outside-in TDD.
      Create the task list following outside-in TDD discipline strictly.


      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be
      tracked.


      Outside-in TDD rules:

      1. The FIRST task group is always the acceptance test (outer loop RED).
         Write the full acceptance test before touching any implementation.
         The test MUST fail for the right reason before proceeding inward.

      2. Work inward layer by layer. For each component, in outermost-first order:
         a. Write the unit test (RED)
         b. Implement just enough to pass (GREEN)
         c. Refactor (REFACTOR)
         Never write implementation before its unit test exists.

      3. The Outer Loop GREEN task group confirms the acceptance test now passes,
         verifies that all affected apps start in the local environment (a smoke
         test that boots each app and confirms no startup/config errors), and
         covers any final refactoring.

      4. Each task group maps to one layer or component from the design doc.
         The order of groups mirrors the outside-in dependency order: outermost
         collaborators first, deepest dependencies last.


      Task format rules:

      - Group related tasks under ## numbered headings

      - Each task MUST be a checkbox: `- [ ] X.Y Task description`

      - Label RED / GREEN / REFACTOR tasks explicitly in the description

      - Tasks should be small enough to complete in one session


      Example structure:

      ```

      ## 0. Acceptance Test — Outer Loop RED

      - [ ] 0.1 Set up test harness and HTTP mocks for all external dependencies
      - [ ] 0.2 Write failing acceptance test: [scenario name from spec]
      - [ ] 0.3 Confirm it fails for the right reason (not a setup error)


      ## 1. [Outermost Component]

      - [ ] 1.1 RED: Write unit test for [interface/behaviour]
      - [ ] 1.2 GREEN: Implement [component] to pass unit test
      - [ ] 1.3 REFACTOR: Clean up [component]


      ## 2. [Next Component Inward]

      - [ ] 2.1 RED: Write unit test for [interface/behaviour]
      - [ ] 2.2 GREEN: Implement [component] to pass unit test
      - [ ] 2.3 REFACTOR: Clean up if needed


      ## N. Acceptance Test — Outer Loop GREEN

      - [ ] N.1 Confirm acceptance test passes end-to-end
      - [ ] N.2 Verify all affected apps start in the local environment (smoke test) — boot each app and confirm no startup/config errors
      - [ ] N.3 REFACTOR: Clean up test setup and mocks if needed


      ## N+1. Change Review — Subagent Verification

      - [ ] N+1.1 Dispatch a subagent to review the change against proposal.md, the spec scenarios, and design.md (reviewer reports findings only, does not edit)
      - [ ] N+1.2 Triage findings: fix every CRITICAL, resolve or accept each WARNING, note SUGGESTIONs; re-run affected tests


      ## N+2. Polish

      - [ ] N+2.1 Run lint — zero errors
      - [ ] N+2.2 Run formatter — zero errors
      - [ ] N+2.3 Run type checker — zero errors
      - [ ] N+2.4 Run coverage report — meets ≥80% threshold on lines, branches, functions


      <!-- OPTIONAL group below — include ONLY when warranted (see rules after this block); omit entirely otherwise -->
      <!--
      ## N+3. Documentation

      - [ ] N+3.1 Update <doc>: <section> (audience: <who>) — <what to update and why it stays useful>
      -->

      ```


      This example mirrors the structure in templates/tasks.md — when you edit
      one, update the other so they do not drift.


      The Change Review group is always placed after the Outer Loop GREEN
      group and before Polish. It contains exactly two tasks:

      1. Dispatch a subagent to review the implemented change. Give the reviewer
         only the change artifacts (proposal.md, the spec scenarios, design.md)
         and the diff plus task list — NOT your implementation reasoning, so it
         verifies independently rather than ratifying your choices. The reviewer
         reports findings only — it MUST NOT edit code. It checks three
         dimensions and assigns each finding a severity:
         - **Completeness**: every `- [ ]` task is genuinely done; every spec
           scenario has a corresponding test and implementation.
         - **Correctness**: implementation matches each requirement; each
           scenario's WHEN/THEN is exercised by a test.
         - **Coherence**: design.md Decisions and Test Boundaries were followed;
           code matches project conventions.
         Severities: **CRITICAL** (must fix — incomplete tasks, missing
         requirement implementations), **WARNING** (should fix — spec/design
         divergences, missing scenario coverage), **SUGGESTION** (nice to fix —
         pattern inconsistencies, minor improvements). When uncertain, prefer
         the lower severity. The reviewer MUST return findings grouped by
         severity, each naming the file or task, the problem, and a suggested
         fix.

      2. Triage the subagent's findings: fix every CRITICAL, resolve or
         consciously accept each WARNING (recording a one-line reason for each
         accepted WARNING), note SUGGESTIONs, and re-run affected tests after
         any fixes.

      These two review tasks are non-negotiable and must appear in every
      tasks.md regardless of change scope.


      The last NON-OPTIONAL task group is always a Polish section with four
      fixed tasks: run lint, run formatter, run type checker, run coverage report
      — all must pass with zero errors. Coverage must meet the project threshold
      (≥80% on lines, branches, and functions). These four tasks are
      non-negotiable and must appear in every tasks.md regardless of change
      scope. Keep Polish to exactly these four tasks — do not append unrelated
      work to it.


      Add a separate Documentation group AFTER Polish ONLY when the change has
      durable, useful information to add or correct in a maintained document.
      Omit the group entirely otherwise. Each task in it MUST name the specific
      document, section, intended audience, information to update, and why it
      remains useful beyond the current change.


      Use these document boundaries:

      - README.md is the entry point for users, operators, and new contributors.
        Update it only for durable changes to setup, usage, deployment,
        configuration, development commands, or high-level capabilities.

      - AGENTS.md is operational guidance for coding agents. Update it only for
        durable constraints, workflows, conventions, verification requirements,
        or recurring pitfalls that should affect future agent behavior.

      - SPEC.md is the product and architecture contract for maintainers making
        design decisions. Update it only for durable product behavior, system
        boundaries, external or cross-module contracts, data models, or
        architectural decisions. Do not add source-level implementation flow or
        transient implementation details.

      - PRD.md is the product requirements document for stakeholders. Update it only for
        durable changes to user-facing features, user experience, or business
        requirements that affect stakeholder understanding and decision-making.

      - Other maintained documents may be updated only when they have a clear
        audience and the change materially affects their stated purpose.


      Do not add a generic documentation review task, require reading AGENTS.md,
      README.md, or SPEC.md on every change, or edit documentation merely to
      record that implementation work happened. Avoid changelog-style summaries,
      duplicated source-level descriptions, and routine additions that make
      repository guidance harder to use.


      Reference specs for WHAT to test (each scenario = one acceptance test),
      design for WHERE the mock boundaries sit, and the dependency graph for the
      correct inside-out ordering of component groups.


      For frontend/UI changes, the view-building task groups MUST point at the
      design mockups imported into the change (`design/<view>.html`, see
      design.md → Visual Design) and apply the Design ↔ contract reconciliation
      recorded in design.md — e.g. build the shared layout first, then each page
      to its named artboard, dropping or adjusting the elements flagged as
      diverging from the contract.
    requires:
      - specs
      - design
  - id: planning-review
    generates: planning-review.md
    description: Pre-implementation planning review — finds and fixes gaps across proposal, specs, design, and tasks
    template: planning-review.md
    instruction: >
      You are a senior engineer reviewing the complete planning package before
      implementation starts.


      Read proposal.md, every specs/**/spec.md file, design.md, and tasks.md.
      Review them as one contract. Your job is to find gaps, fix the owning
      artifact, and leave planning-review.md as the repair log.


      Gap review checklist:

      - **Capability coverage**: every capability named in proposal.md has a
      matching spec file; every changed requirement appears in the correct
      ADDED/MODIFIED/REMOVED/RENAMED section; no capability exists only in
      tasks.md or design.md.

      - **Scenario coverage**: every spec scenario is concrete enough to become
      an acceptance test and has corresponding acceptance-test work in tasks.md.

      - **Design completeness**: design.md resolves implementation-critical
      choices before coding starts: module boundaries, data model or migration
      shape, API contracts, external dependencies, error handling, security
      constraints, async/job behavior, UI states, and rollback or migration
      concerns when applicable.

      - **Test boundaries**: design.md Test Boundaries lists each real or mocked
      collaborator needed by the acceptance test and unit tests. No task should
      invent a mock boundary that design.md does not name.

      - **Task alignment**: tasks.md follows outside-in order and includes work
      for every requirement, scenario, design decision, migration, generated
      client update, visual-design reconciliation, verification step, and
      durable documentation update that the planning artifacts require.

      - **Contradictions and stale assumptions**: proposal, specs, design, and
      tasks do not disagree about scope, endpoints, domain names, persistence
      behavior, dependencies, UI copy/states, or verification expectations.


      If you find a gap, fix the artifact that owns the source of truth before
      finalizing this review:

      - proposal.md owns motivation, scope, capabilities, and impact.

      - specs/**/spec.md owns externally observable behavior and acceptance
      scenarios.

      - design.md owns technical decisions, test boundaries, risks, UI contract
      reconciliation, and implementation-critical unknowns.

      - tasks.md owns the ordered outside-in implementation and verification
      checklist.


      Then write planning-review.md with:

      - **Reviewed Artifacts**: list what you reviewed.

      - **Gaps Found and Fixed**: one row per gap with severity, source artifact,
      problem, fix made, and artifact/section updated.

      - **No Remaining Implementation-Blocking Gaps**: confirm none remain, or
      stop and ask for clarification if a gap cannot be fixed from available
      context.

      - **Deferred Non-Blocking Notes**: optional. Only include if something is
      intentionally deferred and tasks.md or design.md explains when it will be
      resolved.


      Do not use planning-review.md as a wishlist or separate design document.
      It records the review and the fixes already made. Implementation must not
      start until implementation-blocking planning gaps are fixed or explicitly
      clarified by the user.
    requires:
      - proposal
      - specs
      - design
      - tasks
apply:
  requires:
    - planning-review
  tracks: tasks.md
  instruction: |
    You are the orchestrator for an outside-in TDD change. You coordinate work by
    dispatching one implementer subagent per task group and running TDD gates between
    groups. You never write source code yourself.

    ## Your role

    - Read tasks.md and find the first group that has any unchecked `- [ ]` tasks.
    - Dispatch an implementer subagent for that group (see Dispatching below).
    - Wait for the subagent's commit report.
    - Run the TDD gate for that group (see Gates below).
    - Mark all tasks in the group complete (`- [ ]` → `- [x]`) in tasks.md.
    - Proceed to the next pending group.
    - Repeat until all groups are done.

    Lightweight work you do inline (no subagent): updating task checkboxes, running
    the test suite for gate checks, and the Polish group commands.

    ## Dispatching implementer subagents

    Use `subagent_type: outside-in-tdd-implementer` for all implementation groups.
    Each dispatch includes:
    - proposal.md — motivation and scope
    - The spec files relevant to this group's domain (pass only the specs that
      cover the component being implemented, not the full specs glob)
    - design.md — test boundaries and decisions (the HOW)
    - The task lines for that group only (not the full tasks.md)
    - A one-line-per-completed-group git state summary reconstructed from
      `git log --oneline` so the subagent knows what code already exists

    **Partially-complete groups**: if some tasks in the group are already checked
    (`- [x]`), include all task lines and add an explicit note naming which task
    numbers are already done. The agent will skip those and start from the first
    unchecked task.

    **Acceptance test group (group 0)**: mark the dispatch explicitly as the outer
    loop acceptance test group so the agent knows its goal is a correctly-failing
    test, not a passing one.

    The subagent reports back: status (DONE / BLOCKED / NEEDS_CONTEXT), commit
    hash(es), one-line test summary, and any concerns.

    ## TDD gates

    Run the test suite yourself after each group and check the exit code before
    dispatching the next group:

    - After group 0 (Acceptance Test RED): confirm the acceptance test *fails* —
      if it passes, something is wrong; if it errors on a setup issue rather than
      a missing endpoint, pause and report
    - After every component group (RED→GREEN→REFACTOR): confirm all tests pass
    - After the Outer Loop GREEN group: confirm all tests pass before proceeding
      to Change Review

    If tests fail after a GREEN group, re-dispatch the same group's subagent with
    the failure output rather than proceeding.

    ## Special groups

    - **Group 0 — Acceptance Test RED**: dispatch with `subagent_type: outside-in-tdd-implementer`;
      mark it explicitly as the acceptance test group; gate is inverted (test must fail, not pass)
    - **Change Review group**: dispatch a reviewer subagent (use a capable model —
      `claude-sonnet-4-6` or higher — since it reads the full diff and all change
      artifacts) with only proposal.md, the relevant spec files, design.md, and the
      diff — not your implementation reasoning — so it reviews independently; it
      reports findings only and must not edit code. Triage findings yourself: fix
      every CRITICAL, resolve or accept each WARNING (noting a one-line reason for
      each acceptance), note SUGGESTIONs. Do not skip from Outer Loop GREEN to
      Polish. If subagents are unavailable, perform a focused self-review pass instead.
    - **Polish group**: run commands inline — lint, format, typecheck, coverage —
      fix issues inline, mark tasks complete. No subagent needed.

    ## Recovery after context compaction

    Re-read tasks.md and scan for the first group with any unchecked `- [ ]` task.
    Before re-dispatching that group, check `git log --oneline` — if the commits
    look complete for that group's work, mark it done and move on rather than
    re-implementing. Reconstruct the git state summary fresh from `git log` each
    time.

    ## Other rules

    - Pause if you hit blockers or need clarification.
    - Do not edit documentation merely because the change is complete. Update a
      maintained document only when tasks.md includes a specific documentation
      task for durable, useful information that must be added or corrected.
