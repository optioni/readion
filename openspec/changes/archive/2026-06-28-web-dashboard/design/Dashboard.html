<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Readion — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="_ds/readion-38736cfc-91fa-45ef-8524-8103e746ef9f/_ds_bundle.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; font-family: Inter, ui-sans-serif, system-ui; background: #d8d5cf; }
    .canvas-wrap { padding: 48px 56px; }
    .canvas-section { margin-bottom: 56px; }
    .canvas-section-head { margin-bottom: 20px; }
    .canvas-section-title { font-size: 17px; font-weight: 600; color: #2d2520; font-family: -apple-system, system-ui, sans-serif; }
    .canvas-section-sub { font-size: 12px; color: #7a6e65; margin-top: 3px; }
    .canvas-row { display: flex; gap: 40px; flex-wrap: wrap; align-items: flex-start; }
    .artboard-wrap { flex-shrink: 0; }
    .artboard-label { font-size: 11px; color: #7a6e65; margin-bottom: 7px; font-weight: 500; font-family: -apple-system, system-ui, sans-serif; letter-spacing: 0.02em; }
    .artboard-frame { border-radius: 10px; overflow: hidden; box-shadow: 0 2px 32px rgba(0,0,0,0.22), 0 0 0 1px rgba(0,0,0,0.08); }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/readion-38736cfc-91fa-45ef-8524-8103e746ef9f/_ds_bundle.js"></script>

<script type="text/babel" src="app-shell.jsx"></script>
<script type="text/babel">

// ── Canvas shell ─────────────────────────────────────────────────────────────

const Canvas = function(props) { return <div className="canvas-wrap">{props.children}</div>; };
const CanvasSection = function(props) {
  return (
    <div className="canvas-section">
      <div className="canvas-section-head">
        <div className="canvas-section-title">{props.title}</div>
        {props.subtitle && <div className="canvas-section-sub">{props.subtitle}</div>}
      </div>
      <div className="canvas-row">{props.children}</div>
    </div>
  );
};
const Artboard = function(props) {
  return (
    <div className="artboard-wrap" style={{ width: props.width }}>
      <div className="artboard-label">{props.label}</div>
      <div className="artboard-frame" style={{ width: props.width }}>{props.children}</div>
    </div>
  );
};

// ── Tokens ───────────────────────────────────────────────────────────────────

const T = {
  base:     'var(--readion-background-base)',
  surface:  'var(--readion-background-surface)',
  elevated: 'var(--readion-background-elevated)',
  overlay:  'var(--readion-background-overlay)',
  primary:  'var(--readion-primary)',
  accent:   'var(--readion-accent-label)',
  tPrimary: 'var(--readion-text-primary)',
  tSecond:  'var(--readion-text-secondary)',
  tMuted:   'var(--readion-text-muted)',
  tSubtle:  'var(--readion-text-subtle)',
  border:   'var(--readion-border-strong)',
  borderDef:'var(--readion-border-default)',
  poor:     'var(--readion-status-poor)',
  warn:     'var(--readion-status-warning)',
  medium:   'var(--readion-status-medium)',
  good:     'var(--readion-status-good)',
  rMd:      'var(--readion-rounded-md)',
  rLg:      'var(--readion-rounded-lg)',
  rXl:      'var(--readion-rounded-xl)',
  rFull:    'var(--readion-rounded-full)',
};

// ── Helpers ───────────────────────────────────────────────────────────────────

const scoreColor = window.Shell.scoreColor;
const scoreBg = window.Shell.scoreBg;

// ── App sidebar ───────────────────────────────────────────────────────────────

const Shell = window.Shell;
const AppSidebar = () => <Shell.AppSidebar active="Dashboard" admin={true} />;

// ── Progress bar ──────────────────────────────────────────────────────────────

const ReadinessBar = function(props) {
  var pct = props.pct;
  var hero = props.hero;
  var trackBg = hero ? 'rgba(255,255,255,0.15)' : T.border;
  var fillBg = hero ? 'rgba(255,255,255,0.85)' : scoreColor(pct);
  return (
    <div style={{ height: 3, background: trackBg, borderRadius: 3, marginTop: 8 }}>
      <div style={{ height: '100%', width: pct + '%', background: fillBg, borderRadius: 3 }} />
    </div>
  );
};

// ── Domain badge ──────────────────────────────────────────────────────────────

const DomainBadge = function(props) {
  var hero = props.hero;
  var color = hero ? '#fff' : scoreColor(props.pct);
  var bg = hero ? 'rgba(255,255,255,0.12)' : scoreBg(props.pct);
  var border = hero ? 'rgba(255,255,255,0.2)' : 'transparent';
  return (
    <div style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '3px 9px', borderRadius: T.rFull, background: bg, border: '1px solid ' + border }}>
      <div style={{ width: 5, height: 5, borderRadius: '50%', background: color, flexShrink: 0 }} />
      <span style={{ fontSize: 11, color: color, fontWeight: 500 }}>{props.label}</span>
      <span style={{ fontSize: 11, color: hero ? 'rgba(255,255,255,0.55)' : color, opacity: hero ? 1 : 0.75 }}>{props.pct}%</span>
    </div>
  );
};

// ── Session row ───────────────────────────────────────────────────────────────

const SessionRow = function(props) {
  var hero = props.hero;
  var sessions = props.sessions;
  var mutedColor = hero ? 'rgba(255,255,255,0.4)' : T.tMuted;
  var secondColor = hero ? 'rgba(255,255,255,0.65)' : T.tSecond;
  var borderColor = hero ? 'rgba(255,255,255,0.08)' : T.border;
  return (
    <div style={{ display: 'flex', gap: 0 }}>
      {sessions.map(function(s, i) {
        return (
          <div key={i} style={{ flex: 1, paddingRight: i < sessions.length - 1 ? 12 : 0, borderRight: i < sessions.length - 1 ? '1px solid ' + borderColor : 'none', paddingLeft: i > 0 ? 12 : 0 }}>
            <div style={{ fontSize: 11, color: secondColor, fontWeight: 500, marginBottom: 1 }}>{s.when}</div>
            <div style={{ fontSize: 11, color: mutedColor }}>{s.duration}</div>
            {s.delta && <div style={{ fontSize: 11, color: hero ? 'rgba(255,255,255,0.55)' : T.good, marginTop: 1 }}>{s.delta}</div>}
          </div>
        );
      })}
    </div>
  );
};

// ── Cert card ─────────────────────────────────────────────────────────────────

const CertCard = function(props) {
  var cert = props.cert;
  var hero = props.hero;

  var cardStyle = hero
    ? { background: 'linear-gradient(135deg, #1d4ed8 0%, #4f46e5 100%)', boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.15), inset 0 0 48px rgba(79,70,229,0.25)', borderRadius: T.rXl, padding: 24, border: '1px solid rgba(255,255,255,0.1)' }
    : { background: T.surface, borderRadius: T.rXl, padding: 24, border: '1px solid ' + T.border };

  var labelColor    = hero ? 'rgba(255,255,255,0.5)'  : T.tMuted;
  var headColor     = hero ? '#ffffff'                  : T.tPrimary;
  var vendorColor   = hero ? 'rgba(255,255,255,0.55)'  : T.tSecond;
  var scoreColor2   = hero ? '#ffffff'                  : T.tPrimary;
  var deltaColor    = hero ? 'rgba(255,255,255,0.7)'   : T.good;
  var dividerColor  = hero ? 'rgba(255,255,255,0.1)'   : T.border;
  var reviewColor   = hero ? 'rgba(255,255,255,0.7)'   : T.tSecond;
  var reviewMuted   = hero ? 'rgba(255,255,255,0.4)'   : T.tMuted;

  var btnPrimary = hero
    ? { padding: '8px 18px', background: 'rgba(255,255,255,0.18)', color: '#fff', border: '1px solid rgba(255,255,255,0.3)', borderRadius: T.rMd, fontSize: 13, fontWeight: 500, cursor: 'pointer', backdropFilter: 'blur(4px)' }
    : { padding: '8px 18px', background: T.primary, color: '#fff', border: 'none', borderRadius: T.rMd, fontSize: 13, fontWeight: 500, cursor: 'pointer' };

  var btnSecondary = hero
    ? { padding: '8px 18px', background: 'transparent', color: 'rgba(255,255,255,0.7)', border: '1px solid rgba(255,255,255,0.2)', borderRadius: T.rMd, fontSize: 13, cursor: 'pointer' }
    : { padding: '8px 18px', background: 'transparent', color: T.tSecond, border: '1px solid ' + T.border, borderRadius: T.rMd, fontSize: 13, cursor: 'pointer' };

  var reviewBtnStyle = hero
    ? { display: 'inline-flex', alignItems: 'center', gap: 5, padding: '4px 10px', background: 'rgba(255,255,255,0.12)', border: '1px solid rgba(255,255,255,0.2)', borderRadius: T.rFull, fontSize: 12, color: '#fff', cursor: 'pointer', whiteSpace: 'nowrap' }
    : { display: 'inline-flex', alignItems: 'center', gap: 5, padding: '4px 10px', background: 'rgba(29,78,216,0.12)', border: '1px solid rgba(29,78,216,0.25)', borderRadius: T.rFull, fontSize: 12, color: T.accent, cursor: 'pointer', whiteSpace: 'nowrap' };

  return (
    <div style={cardStyle}>
      {/* Header row */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 18 }}>
        <div>
          {hero && (
            <div style={{ fontSize: 10, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'rgba(255,255,255,0.5)', marginBottom: 4 }}>Needs attention</div>
          )}
          <div style={{ fontSize: 16, fontWeight: 600, color: headColor, lineHeight: 1.3, marginBottom: 3 }}>{cert.name}</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ fontSize: 11, color: vendorColor }}>{cert.vendor}</span>
            <span style={{ fontSize: 10, color: hero ? 'rgba(255,255,255,0.35)' : T.tSubtle, background: hero ? 'rgba(255,255,255,0.1)' : T.elevated, padding: '1px 6px', borderRadius: 3, fontFamily: 'var(--readion-font-mono)', letterSpacing: '0.03em' }}>{cert.code}</span>
          </div>
        </div>
        {/* Readiness score */}
        <div style={{ textAlign: 'right', flexShrink: 0, marginLeft: 20 }}>
          <div style={{ fontSize: 'var(--readion-font-size-score)', fontWeight: 700, color: scoreColor2, lineHeight: 1 }}>{cert.readiness}%</div>
          <div style={{ fontSize: 11, color: deltaColor, marginTop: 3 }}>{cert.delta} this week</div>
          <ReadinessBar pct={cert.readiness} hero={hero} />
        </div>
      </div>

      {/* Divider */}
      <div style={{ height: 1, background: dividerColor, marginBottom: 16 }} />

      {/* Weak areas */}
      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 10, letterSpacing: '0.08em', textTransform: 'uppercase', color: labelColor, marginBottom: 8 }}>Weak areas</div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          {cert.weakAreas.map(function(w) {
            return <DomainBadge key={w.label} label={w.label} pct={w.pct} hero={hero} />;
          })}
        </div>
      </div>

      {/* Divider */}
      <div style={{ height: 1, background: dividerColor, marginBottom: 16 }} />

      {/* Recent sessions */}
      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 10, letterSpacing: '0.08em', textTransform: 'uppercase', color: labelColor, marginBottom: 8 }}>Recent sessions</div>
        <SessionRow sessions={cert.sessions} hero={hero} />
      </div>

      {/* Divider */}
      <div style={{ height: 1, background: dividerColor, marginBottom: 16 }} />

      {/* Review row + actions */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
            <span style={{ fontSize: 20, fontWeight: 700, color: scoreColor2 }}>{cert.dueReviews}</span>
            <span style={{ fontSize: 11, color: reviewColor }}>reviews due</span>
          </div>
          <button style={reviewBtnStyle}>
            <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
              <polygon points="4,2 10,6 4,10" fill="currentColor" />
            </svg>
            5-min review
          </button>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <button style={btnSecondary}>Mock exam</button>
          <button style={btnPrimary}>Start session &#8594;</button>
        </div>
      </div>
    </div>
  );
};

// ── Add cert button ───────────────────────────────────────────────────────────

const AddCertButton = function() {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '16px 20px', background: 'transparent', border: '1px dashed ' + T.border, borderRadius: T.rXl, cursor: 'pointer' }}>
      <div style={{ width: 32, height: 32, borderRadius: T.rMd, background: T.surface, border: '1px solid ' + T.border, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M7 2v10M2 7h10" stroke="var(--readion-text-muted)" strokeWidth="1.5" strokeLinecap="round" />
        </svg>
      </div>
      <div>
        <div style={{ fontSize: 13, color: T.tSecond, fontWeight: 500 }}>Add certification</div>
        <div style={{ fontSize: 11, color: T.tMuted, marginTop: 1 }}>Track another exam alongside this one</div>
      </div>
    </div>
  );
};

// ── Dashboard layout ──────────────────────────────────────────────────────────

const Dashboard = function(props) {
  var certs = props.certs;

  // Hero cert is the one with lowest readiness
  var sorted = certs.slice().sort(function(a, b) { return a.readiness - b.readiness; });
  var heroCert = sorted[0];
  var otherCerts = sorted.slice(1);

  return (
    <div style={{ display: 'flex', fontFamily: 'Inter, ui-sans-serif, system-ui', background: T.base, minHeight: 700 }}>
      <AppSidebar hero={false} />

      {/* Main content */}
      <div style={{ flex: 1, padding: '32px 40px', minWidth: 0, overflowY: 'auto' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 28 }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '0.1em', textTransform: 'uppercase', color: T.tMuted, marginBottom: 4 }}>Dashboard</div>
            <div style={{ fontSize: 22, fontWeight: 600, color: T.tPrimary, lineHeight: 1.25 }}>Your certifications</div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, color: T.tMuted }}>
            <div style={{ width: 6, height: 6, borderRadius: '50%', background: T.good }} />
            {certs.length} active
          </div>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <CertCard cert={heroCert} hero={true} />
          {otherCerts.map(function(cert) {
            return <CertCard key={cert.code} cert={cert} hero={false} />;
          })}
          <AddCertButton />
        </div>
      </div>
    </div>
  );
};

// ── Data ──────────────────────────────────────────────────────────────────────

var CERT_2 = [
  {
    code: 'SAA-C03',
    name: 'Solutions Architect - Associate',
    vendor: 'Amazon Web Services',
    readiness: 42,
    delta: '+3%',
    weakAreas: [

      { label: 'Cost Optimization',  pct: 48 },

      { when: 'Yesterday', duration: '25 min', delta: null },

    ],
    dueReviews: 23,
  },
  {
    code: 'PCA',
    name: 'Professional Cloud Architect',
    vendor: 'Google Cloud',
    readiness: 67,
    delta: '+5%',
    weakAreas: [
      { label: 'Reliability',  pct: 52 },

    ],

    dueReviews: 8,

];

var CERT_3 = CERT_2.concat([
  {
    code: 'SY0-701',

    vendor: 'CompTIA',
    readiness: 78,
    delta: '+2%',
    weakAreas: [
      { label: 'Cryptography',    pct: 71 },

    ],
    sessions: [
      { when: '2 days ago', duration: '15 min', delta: null },

      { when: '6 days ago', duration: '30 min', delta: null },
    ],

  },
]);

// ── Day-one empty state ──────────────────────────────────────────────────────
const DayOneCard = () => (
  <div style={{ background: T.surface, borderRadius: T.rXl, padding: 24, border: '1px solid ' + T.border }}>
    {/* Header */}
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 18 }}>
      <div>
        <div style={{ fontSize: 16, fontWeight: 600, color: T.tPrimary, marginBottom: 3 }}>Solutions Architect – Associate</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{ fontSize: 11, color: T.tSecond }}>Amazon Web Services</span>
          <span style={{ fontSize: 10, color: T.tSubtle, background: T.elevated, padding: '1px 6px', borderRadius: 3, fontFamily: 'var(--readion-font-mono)' }}>SAA-C03</span>
        </div>
      </div>
      <div style={{ textAlign: 'right', flexShrink: 0, marginLeft: 20 }}>
        <div style={{ fontSize: 'var(--readion-font-size-score)', fontWeight: 700, color: T.tSubtle, lineHeight: 1 }}>—</div>
        <div style={{ fontSize: 11, color: T.tMuted, marginTop: 3 }}>Not assessed yet</div>
        <div style={{ height: 3, width: 80, background: T.border, borderRadius: 3, marginTop: 8 }} />
      </div>
    </div>
    <div style={{ height: 1, background: T.border, marginBottom: 16 }} />
    {/* Weak areas placeholder */}
    <div style={{ marginBottom: 16 }}>
      <div style={{ fontSize: 10, letterSpacing: '0.08em', textTransform: 'uppercase', color: T.tMuted, marginBottom: 10 }}>Weak areas</div>
      <div style={{ fontSize: 13, color: T.tSubtle, fontStyle: 'italic' }}>Complete your first session to surface weak areas.</div>
    </div>
    <div style={{ height: 1, background: T.border, marginBottom: 16 }} />
    {/* No sessions */}
    <div style={{ marginBottom: 16 }}>
      <div style={{ fontSize: 10, letterSpacing: '0.08em', textTransform: 'uppercase', color: T.tMuted, marginBottom: 10 }}>Recent sessions</div>
      <div style={{ fontSize: 13, color: T.tSubtle, fontStyle: 'italic' }}>No sessions yet.</div>
    </div>
    <div style={{ height: 1, background: T.border, marginBottom: 16 }} />
    {/* CTA row */}
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
      <div style={{ fontSize: 13, color: T.tMuted }}>
        <span style={{ color: T.accent, cursor: 'pointer' }}>Take diagnostic</span>
        <span style={{ color: T.tSubtle }}> to personalise your sessions</span>
      </div>
      <button style={{ padding: '9px 20px', background: T.primary, color: '#fff', border: 'none', borderRadius: T.rMd, fontSize: 13, fontWeight: 500, cursor: 'pointer', flexShrink: 0 }}>
        Start first session &#8594;
      </button>
    </div>
  </div>
);

const DayOneDashboard = () => (
  <div style={{ display: 'flex', fontFamily: 'Inter, ui-sans-serif, system-ui', background: T.base }}>
    <AppSidebar />
    {/* Content */}
    <div style={{ flex: 1, padding: '32px 40px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 20 }}>
        <div>
          <div style={{ fontSize: 11, letterSpacing: '0.1em', textTransform: 'uppercase', color: T.tMuted, marginBottom: 4 }}>Dashboard</div>
          <div style={{ fontSize: 22, fontWeight: 600, color: T.tPrimary }}>Your certifications</div>
        </div>
      </div>
      {/* Welcome callout */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px', background: 'rgba(124,140,248,0.06)', border: '1px solid rgba(124,140,248,0.18)', borderRadius: T.rXl, marginBottom: 16 }}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--readion-accent-label)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <div style={{ fontSize: 13, color: T.tSecond }}>Welcome! Start your first session or take a short diagnostic to personalise your study plan from day one.</div>
      </div>
      <DayOneCard />
      {/* Add cert */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '14px 20px', background: 'transparent', border: '1px dashed ' + T.border, borderRadius: T.rXl, cursor: 'pointer', marginTop: 14 }}>
        <div style={{ width: 32, height: 32, borderRadius: T.rMd, background: T.surface, border: '1px solid ' + T.border, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2v10M2 7h10" stroke="var(--readion-text-muted)" strokeWidth="1.4" strokeLinecap="round"/></svg>
        </div>
        <div><div style={{ fontSize: 13, color: T.tSecond, fontWeight: 500 }}>Add certification</div><div style={{ fontSize: 11, color: T.tMuted, marginTop: 1 }}>Track another exam alongside this one</div></div>
      </div>
    </div>
  </div>
);

// ── App ───────────────────────────────────────────────────────────────────────

function App() {
  return (
    <Canvas>
      <CanvasSection
        title="Dashboard"
        subtitle="Hero card (gradient) marks the lowest-readiness cert. Standard surface cards for all others. Status dot colors map directly to domain scores."
      >
        <Artboard label="2 certifications" width={1100}>
          <Dashboard certs={CERT_2} />
        </Artboard>
        <Artboard label="3 certifications" width={1100}>
          <Dashboard certs={CERT_3} />
        </Artboard>
        <Artboard label="Day one — enrolled, no sessions yet" width={1100}>
          <DayOneDashboard />
        </Artboard>
      </CanvasSection>
    </Canvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
