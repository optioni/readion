<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Readion — Session View</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="_ds/readion-38736cfc-91fa-45ef-8524-8103e746ef9f/_ds_bundle.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; font-family: Inter, ui-sans-serif, system-ui; background: #c8c4bd; }
    .canvas-wrap { padding: 48px 56px; }
    .canvas-section { margin-bottom: 56px; }
    .canvas-section-head { margin-bottom: 20px; }
    .canvas-section-title { font-size: 17px; font-weight: 600; color: #2d2520; }
    .canvas-section-sub { font-size: 12px; color: #7a6e65; margin-top: 3px; }
    .canvas-row { display: flex; gap: 40px; flex-wrap: wrap; align-items: flex-start; }
    .artboard-wrap { flex-shrink: 0; }
    .artboard-label { font-size: 11px; color: #7a6e65; margin-bottom: 7px; font-weight: 500; letter-spacing: 0.02em; }
    .artboard-frame { border-radius: 10px; overflow: hidden; box-shadow: 0 2px 32px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/readion-38736cfc-91fa-45ef-8524-8103e746ef9f/_ds_bundle.js"></script>

<script type="text/babel" src="app-shell.jsx"></script>
<script type="text/babel">

// ── Canvas shell ─────────────────────────────────────────────────────────────
const Canvas = (p) => <div className="canvas-wrap">{p.children}</div>;
const CanvasSection = (p) => (
  <div className="canvas-section">
    <div className="canvas-section-head">
      <div className="canvas-section-title">{p.title}</div>
      {p.subtitle && <div className="canvas-section-sub">{p.subtitle}</div>}
    </div>
    <div className="canvas-row">{p.children}</div>
  </div>
);
const Artboard = (p) => (
  <div className="artboard-wrap" style={{ width: p.width }}>
    <div className="artboard-label">{p.label}</div>
    <div className="artboard-frame" style={{ width: p.width, height: p.height, overflow: 'hidden' }}>{p.children}</div>
  </div>
);

// ── Token map ────────────────────────────────────────────────────────────────
const T = {
  base:     'var(--readion-background-base)',
  surface:  'var(--readion-background-surface)',
  elevated: 'var(--readion-background-elevated)',
  overlay:  'var(--readion-background-overlay)',
  primary:  'var(--readion-primary)',
  accent:   'var(--readion-accent-label)',
  tPrimary: 'var(--readion-text-primary)',
  tSecond:  'var(--readion-text-secondary)',
  tMuted:   'var(--readion-text-muted)',
  tSubtle:  'var(--readion-text-subtle)',
  border:   'var(--readion-border-strong)',
  borderDef:'var(--readion-border-default)',
  poor:     'var(--readion-status-poor)',
  good:     'var(--readion-status-good)',
  rSm:      'var(--readion-rounded-sm)',
  rMd:      'var(--readion-rounded-md)',
  rLg:      'var(--readion-rounded-lg)',
  rXl:      'var(--readion-rounded-xl)',
  rFull:    'var(--readion-rounded-full)',
};

// ── App sidebar ───────────────────────────────────────────────────────────────
const Shell = window.Shell;
const AppSidebar = () => <Shell.AppSidebar active="Sessions" admin={false} />;

// ── Session header ────────────────────────────────────────────────────────────
const SessionHeader = ({ current, total, elapsed }) => {
  const pct = (current / total) * 100;
  return (
    <div style={{ borderBottom: '1px solid ' + T.border, padding: '12px 28px', display: 'flex', alignItems: 'center', gap: 20, background: T.surface, flexShrink: 0 }}>
      <div style={{ flex: 1 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ fontSize: 11, fontFamily: 'var(--readion-font-mono)', color: T.tMuted, background: T.elevated, padding: '2px 6px', borderRadius: T.rSm }}>SAA-C03</span>
            <span style={{ fontSize: 12, color: T.tSecond }}>Solutions Architect – Associate</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--readion-text-muted)" strokeWidth="1.8" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            <span style={{ fontSize: 13, fontFamily: 'var(--readion-font-mono)', color: T.tMuted }}>{elapsed}</span>
            <div style={{ width: 1, height: 12, background: T.border, margin: '0 4px' }} />
            <span style={{ fontSize: 12, color: T.tSecond }}>{current}<span style={{ color: T.tMuted }}>/{total}</span></span>
          </div>
        </div>
        <div style={{ height: 3, background: T.border, borderRadius: 3 }}>
          <div style={{ height: '100%', width: pct + '%', background: T.accent, borderRadius: 3 }} />
        </div>
      </div>
      <button style={{ padding: '5px 12px', background: 'transparent', border: '1px solid ' + T.border, borderRadius: T.rMd, fontSize: 12, color: T.tMuted, cursor: 'pointer', flexShrink: 0 }}>
        End session
      </button>
    </div>
  );
};

// ── Citation chip ─────────────────────────────────────────────────────────────
const CitationChip = ({ label }) => (
  <div style={{ display: 'inline-flex', alignItems: 'center', gap: 4, padding: '2px 8px', background: 'rgba(124,140,248,0.08)', border: '1px solid rgba(124,140,248,0.2)', borderRadius: T.rFull, cursor: 'pointer' }}>
    <svg width="9" height="9" viewBox="0 0 12 12" fill="none"><path d="M6 1h4a1 1 0 011 1v9a1 1 0 01-1 1H2a1 1 0 01-1-1V5l4-4z" stroke="var(--readion-accent-label)" strokeWidth="1.2" strokeLinejoin="round"/><path d="M6 1v4h4" stroke="var(--readion-accent-label)" strokeWidth="1.2" strokeLinejoin="round"/></svg>
    <span style={{ fontSize: 10, color: T.accent, letterSpacing: '0.01em' }}>{label}</span>
  </div>
);

// ── Reading block ─────────────────────────────────────────────────────────────
const ReadingBlock = ({ domain, tldr, expanded, citations }) => (
  <div style={{ background: T.surface, borderRadius: T.rXl, padding: '20px 24px', border: '1px solid ' + T.border }}>
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
      <div style={{ padding: '2px 8px', background: 'rgba(124,140,248,0.1)', border: '1px solid rgba(124,140,248,0.2)', borderRadius: T.rFull }}>
        <span style={{ fontSize: 10, letterSpacing: '0.08em', textTransform: 'uppercase', color: T.accent }}>Reading</span>
      </div>
      <span style={{ fontSize: 12, color: T.tMuted }}>IAM &amp; Security</span>
    </div>

    {/* TL;DR */}
    <div style={{ marginBottom: 12 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8 }}>
        <span style={{ fontSize: 10, letterSpacing: '0.08em', textTransform: 'uppercase', color: T.tMuted, fontWeight: 500 }}>TL;DR</span>
        <div style={{ flex: 1, height: 1, background: T.border }} />
      </div>
      <p style={{ fontSize: 14, color: T.tSecond, lineHeight: 1.65 }}>
        {tldr}
      </p>
    </div>

    {/* Expanded explanation */}
    {expanded && (
      <div style={{ marginBottom: 12, padding: '14px 16px', background: T.base, borderRadius: T.rLg, border: '1px solid ' + T.borderDef }}>
        <p style={{ fontSize: 13, color: T.tSecond, lineHeight: 1.7, marginBottom: 10 }}>
          SCPs work alongside IAM policies using a logical AND — both must allow an action for it to succeed. An SCP that denies <code style={{ fontFamily: 'var(--readion-font-mono)', fontSize: 12, color: T.accent, background: 'rgba(124,140,248,0.08)', padding: '1px 5px', borderRadius: 3 }}>cloudtrail:DeleteTrail</code> will prevent that action even if a user's IAM policy explicitly allows it.
        </p>
        <p style={{ fontSize: 13, color: T.tSecond, lineHeight: 1.7 }}>
          Key distinction: SCPs never grant permissions — they only restrict. The management account is never affected by SCPs, a common exam trap.
        </p>
      </div>
    )}

    {/* Expand toggle */}
    {!expanded && (
      <div style={{ marginBottom: 12 }}>
        <span style={{ fontSize: 12, color: T.accent, cursor: 'pointer' }}>Read full explanation ↓</span>
      </div>
    )}

    {/* Citations */}
    <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
      {citations.map((c) => <CitationChip key={c} label={c} />)}
    </div>
  </div>
);

// ── Quiz option ───────────────────────────────────────────────────────────────
// state: 'rest' | 'selected' | 'correct' | 'incorrect' | 'dim'
const QuizOption = ({ letter, text, state }) => {
  const styles = {
    rest:      { bg: T.base, border: T.borderDef, color: T.tSecond, letterColor: T.tMuted },
    selected:  { bg: T.primary, border: T.primary, color: '#fff', letterColor: 'rgba(255,255,255,0.6)' },
    correct:   { bg: T.base, border: 'var(--readion-status-good)', color: 'var(--readion-status-good)', letterColor: 'var(--readion-status-good)' },
    incorrect: { bg: T.base, border: 'var(--readion-status-poor)', color: 'var(--readion-status-poor)', letterColor: 'var(--readion-status-poor)' },
    dim:       { bg: T.base, border: T.borderDef, color: T.tSubtle, letterColor: T.tSubtle },
  };
  const s = styles[state] || styles.rest;

  return (
    <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12, padding: '10px 14px', background: s.bg, border: '1px solid ' + s.border, borderRadius: T.rMd, cursor: state === 'dim' || state === 'correct' ? 'default' : 'pointer', transition: 'border-color 0.15s' }}>
      <div style={{ width: 20, height: 20, borderRadius: T.rSm, background: state === 'selected' ? 'rgba(255,255,255,0.2)' : T.surface, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, marginTop: 1 }}>
        <span style={{ fontSize: 11, fontWeight: 600, color: s.letterColor, fontFamily: 'var(--readion-font-mono)' }}>{letter}</span>
      </div>
      <span style={{ fontSize: 14, color: s.color, lineHeight: 1.5, flex: 1 }}>{text}</span>
      {state === 'correct' && (
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style={{ flexShrink: 0, marginTop: 2 }}>
          <circle cx="8" cy="8" r="7" fill="rgba(52,211,153,0.15)" stroke="var(--readion-status-good)" strokeWidth="1.2"/>
          <path d="M5 8l2 2 4-4" stroke="var(--readion-status-good)" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {state === 'incorrect' && (
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style={{ flexShrink: 0, marginTop: 2 }}>
          <circle cx="8" cy="8" r="7" fill="rgba(248,113,113,0.12)" stroke="var(--readion-status-poor)" strokeWidth="1.2"/>
          <path d="M5.5 5.5l5 5M10.5 5.5l-5 5" stroke="var(--readion-status-poor)" strokeWidth="1.4" strokeLinecap="round"/>
        </svg>
      )}
    </div>
  );
};

// ── Quiz card ─────────────────────────────────────────────────────────────────
const QuizCard = ({ qNum, qTotal, question, options, submitted }) => (
  <div style={{ background: T.surface, borderRadius: T.rXl, padding: '20px 24px', border: '1px solid ' + T.border }}>
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
      <div style={{ padding: '2px 8px', background: 'rgba(29,78,216,0.1)', border: '1px solid rgba(29,78,216,0.2)', borderRadius: T.rFull }}>
        <span style={{ fontSize: 10, letterSpacing: '0.08em', textTransform: 'uppercase', color: T.accent }}>Question</span>
      </div>
      <span style={{ fontSize: 12, color: T.tMuted }}>Q{qNum} of {qTotal}</span>
    </div>

    <p style={{ fontSize: 14, color: T.tPrimary, lineHeight: 1.65, marginBottom: 18 }}>{question}</p>

    <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 18 }}>
      {options.map((opt) => <QuizOption key={opt.letter} letter={opt.letter} text={opt.text} state={opt.state} />)}
    </div>

    {!submitted ? (
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <button style={{ padding: '8px 20px', background: T.primary, color: '#fff', border: 'none', borderRadius: T.rMd, fontSize: 13, fontWeight: 500, cursor: 'pointer' }}>
          Submit answer
        </button>
        <span style={{ fontSize: 12, color: T.tSubtle, cursor: 'pointer' }}>Report this question</span>
      </div>
    ) : (
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <button style={{ padding: '8px 20px', background: T.primary, color: '#fff', border: 'none', borderRadius: T.rMd, fontSize: 13, fontWeight: 500, cursor: 'pointer' }}>
          Continue →
        </button>
        <span style={{ fontSize: 12, color: T.tSubtle, cursor: 'pointer' }}>Report this question</span>
      </div>
    )}
  </div>
);

// ── Confidence rating ─────────────────────────────────────────────────────────
const ConfidenceRating = ({ selected }) => (
  <div style={{ background: T.surface, borderRadius: T.rXl, padding: '18px 24px', border: '1px solid ' + T.border }}>
    <div style={{ fontSize: 12, color: T.tSecond, marginBottom: 12 }}>How confident do you feel about <strong style={{ color: T.tPrimary }}>IAM &amp; SCPs</strong>?</div>
    <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}>
      {[1, 2, 3, 4, 5].map((n) => (
        <button key={n} style={{ flex: 1, padding: '8px 0', background: n === selected ? T.primary : T.base, color: n === selected ? '#fff' : T.tMuted, border: '1px solid ' + (n === selected ? T.primary : T.border), borderRadius: T.rMd, fontSize: 16, cursor: 'pointer' }}>
          {['😕', '🤔', '😐', '🙂', '😎'][n - 1]}
        </button>
      ))}
    </div>
    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
      <span style={{ fontSize: 10, color: T.tSubtle }}>Not at all</span>
      <span style={{ fontSize: 10, color: T.tSubtle }}>Very confident</span>
    </div>
  </div>
);

// ── Agent tool cards ──────────────────────────────────────────────────────────
const ToolCardExplanation = () => (
  <div style={{ background: T.surface, border: '1px solid ' + T.border, borderRadius: T.rLg, padding: '12px 14px', marginTop: 6 }}>
    <div style={{ fontSize: 10, letterSpacing: '0.08em', textTransform: 'uppercase', color: T.accent, marginBottom: 8 }}>Explanation</div>
    <p style={{ fontSize: 12, color: T.tSecond, lineHeight: 1.6, marginBottom: 8 }}>
      IAM policies operate at the principal level — they control what a specific user or role can do. SCPs operate at the account level and define the maximum boundary of permissions for the entire account.
    </p>
    <p style={{ fontSize: 12, color: T.tSecond, lineHeight: 1.6 }}>
      Even if a user has <code style={{ fontFamily: 'var(--readion-font-mono)', fontSize: 11, color: T.accent }}>Allow: *</code> on their IAM policy, an SCP <code style={{ fontFamily: 'var(--readion-font-mono)', fontSize: 11, color: T.poor }}>Deny: cloudtrail:DeleteTrail</code> prevents the action. Both must allow it.
    </p>
    <div style={{ marginTop: 10, display: 'flex', gap: 6 }}>
      <CitationChip label="AWS Docs: SCPs" />
      <CitationChip label="AWS Docs: Policy Evaluation" />
    </div>
  </div>
);

const ToolCardProgress = ({ domain, pct, prevPct }) => (
  <div style={{ background: T.surface, border: '1px solid ' + T.border, borderRadius: T.rLg, padding: '12px 14px', marginTop: 6 }}>
    <div style={{ fontSize: 10, letterSpacing: '0.08em', textTransform: 'uppercase', color: T.accent, marginBottom: 10 }}>Your progress · {domain}</div>
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
      <div style={{ flex: 1, height: 6, background: T.border, borderRadius: 3 }}>
        <div style={{ height: '100%', width: pct + '%', background: 'var(--readion-status-warning)', borderRadius: 3 }} />
      </div>
      <span style={{ fontSize: 13, fontWeight: 600, color: T.tPrimary, width: 36, textAlign: 'right' }}>{pct}%</span>
    </div>
    <div style={{ fontSize: 11, color: T.tMuted }}>
      <span style={{ color: 'var(--readion-status-good)' }}>↑{pct - prevPct}%</span> since session started
    </div>
  </div>
);

// ── Agent bubble ──────────────────────────────────────────────────────────────
const AgentBubble = ({ role, content, tool }) => {
  const isUser = role === 'user';
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: isUser ? 'flex-end' : 'flex-start', marginBottom: 14 }}>
      {!isUser && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 5, marginBottom: 5 }}>
          <div style={{ width: 16, height: 16, borderRadius: '50%', background: 'rgba(124,140,248,0.2)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <svg width="8" height="8" viewBox="0 0 12 12" fill="none"><path d="M6 1l1.5 3.5L11 5l-2.5 2.5.5 3.5L6 9.5 3 11l.5-3.5L1 5l3.5-.5z" fill="var(--readion-accent-label)"/></svg>
          </div>
          <span style={{ fontSize: 10, color: T.tMuted }}>Study assistant</span>
        </div>
      )}
      <div style={{ maxWidth: '90%', padding: '8px 12px', background: isUser ? T.primary : T.surface, border: '1px solid ' + (isUser ? T.primary : T.border), borderRadius: isUser ? '10px 10px 2px 10px' : '10px 10px 10px 2px', fontSize: 13, color: isUser ? '#fff' : T.tSecond, lineHeight: 1.55 }}>
        {content}
        {tool === 'explanation' && <ToolCardExplanation />}
        {tool === 'progress' && <ToolCardProgress domain="IAM & Security" pct={48} prevPct={38} />}
      </div>
    </div>
  );
};

// ── Agent panel ───────────────────────────────────────────────────────────────
const AgentPanel = ({ messages, collapsed }) => {
  if (collapsed) {
    return (
      <div style={{ width: 44, flexShrink: 0, background: T.elevated, borderLeft: '1px solid ' + T.border, display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '16px 0', gap: 12 }}>
        <div style={{ width: 28, height: 28, borderRadius: T.rMd, background: 'rgba(124,140,248,0.12)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--readion-accent-label)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
          </svg>
        </div>
        <div style={{ width: 1, flex: 1, background: T.border }} />
        <div style={{ writingMode: 'vertical-rl', fontSize: 10, color: T.tSubtle, letterSpacing: '0.08em', textTransform: 'uppercase', transform: 'rotate(180deg)', cursor: 'pointer' }}>Ask AI</div>
      </div>
    );
  }

  return (
    <div style={{ width: 320, flexShrink: 0, background: T.elevated, borderLeft: '1px solid ' + T.border, display: 'flex', flexDirection: 'column' }}>
      {/* Agent header */}
      <div style={{ padding: '12px 16px', borderBottom: '1px solid ' + T.border, display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexShrink: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
          <div style={{ width: 20, height: 20, borderRadius: '50%', background: 'rgba(124,140,248,0.2)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M6 1l1.5 3.5L11 5l-2.5 2.5.5 3.5L6 9.5 3 11l.5-3.5L1 5l3.5-.5z" fill="var(--readion-accent-label)"/></svg>
          </div>
          <span style={{ fontSize: 13, fontWeight: 500, color: T.tPrimary }}>Study assistant</span>
          <div style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--readion-status-good)' }} />
        </div>
        <button style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4, color: T.tMuted }}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      {/* Messages */}
      <div style={{ flex: 1, padding: '14px 14px', overflowY: 'auto', display: 'flex', flexDirection: 'column' }}>
        {messages.map((m, i) => <AgentBubble key={i} role={m.role} content={m.content} tool={m.tool} />)}
      </div>

      {/* Input */}
      <div style={{ padding: '12px 14px', borderTop: '1px solid ' + T.border, flexShrink: 0 }}>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center', background: T.surface, border: '1px solid ' + T.border, borderRadius: T.rLg, padding: '7px 12px' }}>
          <input placeholder="Ask anything about this topic..." style={{ flex: 1, background: 'none', border: 'none', outline: 'none', fontSize: 13, color: T.tPrimary, fontFamily: 'inherit' }} readOnly />
          <button style={{ background: T.primary, border: 'none', borderRadius: T.rMd, width: 26, height: 26, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', flexShrink: 0 }}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <div style={{ display: 'flex', gap: 6, marginTop: 8, flexWrap: 'wrap' }}>
          {['Explain this', 'My progress here', 'Exam tips'].map((s) => (
            <div key={s} style={{ padding: '3px 9px', background: T.surface, border: '1px solid ' + T.border, borderRadius: T.rFull, fontSize: 11, color: T.tMuted, cursor: 'pointer' }}>{s}</div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ── Session layout ────────────────────────────────────────────────────────────
const SessionLayout = ({ current, total, elapsed, leftContent, agentMessages, agentCollapsed }) => (
  <div style={{ display: 'flex', fontFamily: 'Inter, ui-sans-serif, system-ui', background: T.base, height: '100%' }}>
    <AppSidebar />
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
      <SessionHeader current={current} total={total} elapsed={elapsed} />
      <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
        {/* Left: content */}
        <div style={{ flex: 1, overflowY: 'auto', padding: '24px 28px', display: 'flex', flexDirection: 'column', gap: 14 }}>
          {leftContent}
        </div>
        {/* Right: agent */}
        <AgentPanel messages={agentMessages} collapsed={agentCollapsed} />
      </div>
    </div>
  </div>
);

// ── Scene data ────────────────────────────────────────────────────────────────

const QUESTION = "A company uses AWS Organizations to manage 12 accounts. The security team needs to ensure no account can disable AWS CloudTrail, even account administrators. Which solution meets this requirement with the least operational overhead?";

const OPTIONS_UNANSWERED = [
  { letter: 'A', text: 'Apply a deny IAM policy to all IAM users and roles in each account', state: 'rest' },
  { letter: 'B', text: 'Create an SCP at the root OU with an explicit deny on cloudtrail:DeleteTrail and cloudtrail:StopLogging', state: 'rest' },
  { letter: 'C', text: 'Use AWS Config rules with auto-remediation to detect and reverse any CloudTrail changes', state: 'selected' },
  { letter: 'D', text: 'Enable CloudTrail in all regions with a multi-region trail in each account', state: 'rest' },
];

const OPTIONS_SUBMITTED = [
  { letter: 'A', text: 'Apply a deny IAM policy to all IAM users and roles in each account', state: 'dim' },
  { letter: 'B', text: 'Create an SCP at the root OU with an explicit deny on cloudtrail:DeleteTrail and cloudtrail:StopLogging', state: 'correct' },
  { letter: 'C', text: 'Use AWS Config rules with auto-remediation to detect and reverse any CloudTrail changes', state: 'incorrect' },
  { letter: 'D', text: 'Enable CloudTrail in all regions with a multi-region trail in each account', state: 'dim' },
];

const TLDR = "Service control policies (SCPs) define permission guardrails at the AWS Organizations level. They don't grant permissions — they establish the maximum permissions any account can have. An explicit SCP deny overrides any IAM allow.";

const MSGS_IDLE = [
  { role: 'agent', content: "I'm following along. Let me know if you'd like me to explain anything or fetch more context on SCPs." },
];

const MSGS_ACTIVE = [
  { role: 'agent', content: "I'm following along. Let me know if you'd like me to explain anything." },
  { role: 'user', content: "Why can't I just use an IAM policy instead of an SCP here?" },
  { role: 'agent', content: "Great question — the key difference is scope.", tool: 'explanation' },
];

const MSGS_PROGRESS = [
  { role: 'user', content: "How am I doing on IAM overall?" },
  { role: 'agent', content: "You've improved a lot this session.", tool: 'progress' },
];

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  return (
    <Canvas>
      <CanvasSection
        title="Session view"
        subtitle="Split-panel study interface. Left: alternating reading + quiz blocks. Right: AI agent with tool results. Status colors on quiz options appear only after submission."
      >
        {/* State 1: reading block + quiz unanswered */}
        <Artboard label="Answering — option selected (not submitted)" width={1200} height={820}>
          <SessionLayout
            current={3} total={12} elapsed="18:42"
            leftContent={[
              <ReadingBlock
                key="read"
                domain="IAM & Security"
                tldr={TLDR}
                expanded={false}
                citations={['AWS Docs: SCPs', 'AWS Docs: IAM Policies']}
              />,
              <QuizCard
                key="quiz"
                qNum={3} qTotal={12}
                question={QUESTION}
                options={OPTIONS_UNANSWERED}
                submitted={false}
              />,
            ]}
            agentMessages={MSGS_IDLE}
            agentCollapsed={false}
          />
        </Artboard>

        {/* State 2: submitted — wrong answer, agent explaining */}
        <Artboard label="Submitted — incorrect + agent explanation tool card" width={1200} height={820}>
          <SessionLayout
            current={3} total={12} elapsed="19:15"
            leftContent={[
              <QuizCard
                key="quiz"
                qNum={3} qTotal={12}
                question={QUESTION}
                options={OPTIONS_SUBMITTED}
                submitted={true}
              />,
              <ConfidenceRating key="conf" selected={2} />,
            ]}
            agentMessages={MSGS_ACTIVE}
            agentCollapsed={false}
          />
        </Artboard>

        {/* State 3: reading expanded, agent collapsed */}
        <Artboard label="Reading expanded — agent collapsed to rail" width={1200} height={820}>
          <SessionLayout
            current={4} total={12} elapsed="21:08"
            leftContent={[
              <ReadingBlock
                key="read"
                domain="IAM & Security"
                tldr={TLDR}
                expanded={true}
                citations={['AWS Docs: SCPs', 'AWS Docs: IAM Policies', 'AWS Docs: Policy Evaluation Logic']}
              />,
            ]}
            agentMessages={MSGS_PROGRESS}
            agentCollapsed={true}
          />
        </Artboard>
      </CanvasSection>
    </Canvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
