<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Readion Admin — Cert Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="_ds/readion-38736cfc-91fa-45ef-8524-8103e746ef9f/_ds_bundle.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; font-family: Inter, ui-sans-serif, system-ui; background: #b8b4ac; }
    .canvas-wrap { padding: 48px 56px; }
    .canvas-section { margin-bottom: 56px; }
    .canvas-section-head { margin-bottom: 20px; }
    .canvas-section-title { font-size: 17px; font-weight: 600; color: #2d2520; }
    .canvas-section-sub { font-size: 12px; color: #7a6e65; margin-top: 3px; }
    .canvas-row { display: flex; gap: 40px; flex-wrap: wrap; align-items: flex-start; }
    .artboard-wrap { flex-shrink: 0; }
    .artboard-label { font-size: 11px; color: #7a6e65; margin-bottom: 7px; font-weight: 500; letter-spacing: 0.02em; }
    .artboard-frame { border-radius: 10px; overflow: hidden; box-shadow: 0 2px 32px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/readion-38736cfc-91fa-45ef-8524-8103e746ef9f/_ds_bundle.js"></script>

<script type="text/babel" src="app-shell.jsx"></script>
<script type="text/babel">

// ── Canvas ────────────────────────────────────────────────────────────────────
const Canvas = (p) => <div className="canvas-wrap">{p.children}</div>;
const CanvasSection = (p) => (
  <div className="canvas-section">
    <div className="canvas-section-head">
      <div className="canvas-section-title">{p.title}</div>
      {p.subtitle && <div className="canvas-section-sub">{p.subtitle}</div>}
    </div>
    <div className="canvas-row">{p.children}</div>
  </div>
);
const Artboard = (p) => (
  <div className="artboard-wrap" style={{ width: p.width }}>
    <div className="artboard-label" style={{ marginBottom: 8 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', marginBottom: 3 }}>
        <span style={{ fontSize: 12.5, fontWeight: 600, color: '#2d2520', letterSpacing: '0.01em' }}>{p.screen || p.label}</span>
        {p.state && <span style={{ fontSize: 10, fontWeight: 500, color: '#5f5349', background: 'rgba(0,0,0,0.055)', border: '1px solid rgba(0,0,0,0.09)', borderRadius: 999, padding: '1px 8px', letterSpacing: '0.02em', whiteSpace: 'nowrap' }}>{p.state}</span>}
      </div>
      {p.route && <div style={{ fontSize: 11, color: '#94897f', fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace' }}>{p.route}</div>}
    </div>
    <div className="artboard-frame" data-screen={p.screen} data-state={p.state} data-route={p.route} data-screen-label={p.screen} style={{ width: p.width, height: p.height, overflow: 'hidden' }}>{p.children}</div>
  </div>
);

// ── Tokens ────────────────────────────────────────────────────────────────────
const T = {
  base:     'var(--readion-background-base)',
  surface:  'var(--readion-background-surface)',
  elevated: 'var(--readion-background-elevated)',
  overlay:  'var(--readion-background-overlay)',
  primary:  'var(--readion-primary)',
  accent:   'var(--readion-accent-label)',
  tPrimary: 'var(--readion-text-primary)',
  tSecond:  'var(--readion-text-secondary)',
  tMuted:   'var(--readion-text-muted)',
  tSubtle:  'var(--readion-text-subtle)',
  border:   'var(--readion-border-strong)',
  borderDef:'var(--readion-border-default)',
  poor:     'var(--readion-status-poor)',
  warn:     'var(--readion-status-warning)',
  medium:   'var(--readion-status-medium)',
  good:     'var(--readion-status-good)',
  rSm:      'var(--readion-rounded-sm)',
  rMd:      'var(--readion-rounded-md)',
  rLg:      'var(--readion-rounded-lg)',
  rXl:      'var(--readion-rounded-xl)',
  rFull:    'var(--readion-rounded-full)',
};

// ── Admin sidebar ─────────────────────────────────────────────────────────────
const Shell = window.Shell;
const AdminSidebar = ({ active }) => <Shell.AdminSidebar active={active} />;

// ── Setup header ──────────────────────────────────────────────────────────────
const SetupHeader = ({ certCode, certName, step, totalSteps, stepLabel }) => (
  <div style={{ borderBottom: '1px solid ' + T.border, padding: '14px 28px', background: T.elevated, flexShrink: 0 }}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 }}>
          <span style={{ fontSize: 11, color: T.tMuted }}>Certifications</span>
          <span style={{ fontSize: 11, color: T.tSubtle }}>›</span>
          <span style={{ fontSize: 11, color: T.tMuted }}>New</span>
          <span style={{ fontSize: 11, color: T.tSubtle }}>›</span>
          <span style={{ fontSize: 11, color: T.tSecond }}>{certCode || 'Setup'}</span>
        </div>
        <div style={{ fontSize: 16, fontWeight: 600, color: T.tPrimary }}>{certName || 'New certification'}</div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexShrink: 0 }}>
        <span style={{ fontSize: 12, color: T.tMuted }}>Step {step} of {totalSteps} &middot; {stepLabel}</span>
        <div style={{ width: 120, height: 3, background: T.border, borderRadius: 3 }}>
          <div style={{ height: '100%', width: ((step / totalSteps) * 100) + '%', background: T.accent, borderRadius: 3 }} />
        </div>
      </div>
    </div>
  </div>
);

// ── Step 1: Identify certification ────────────────────────────────────────────
const IdentityField = ({ label, value, placeholder, hint, optional, mono }) => (
  <div style={{ marginBottom: 18 }}>
    <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, fontWeight: 500, color: T.tSecond, marginBottom: 6 }}>
      {label}
      {optional && <span style={{ fontSize: 10, color: T.tSubtle, fontWeight: 400 }}>Optional</span>}
    </label>
    <input readOnly defaultValue={value || ''} placeholder={placeholder}
      style={{ width: '100%', padding: '9px 12px', background: T.base, border: '1px solid ' + T.border, borderRadius: T.rMd, fontSize: 14, color: T.tPrimary, fontFamily: mono ? 'var(--readion-font-mono)' : 'inherit', outline: 'none' }} />
    {hint && <div style={{ fontSize: 11, color: T.tSubtle, marginTop: 5, lineHeight: 1.5 }}>{hint}</div>}
  </div>
);

const IdentifyCertScreen = () => (
  <div style={{ display: 'flex', fontFamily: 'Inter, ui-sans-serif, system-ui', background: T.base, height: '100%' }}>
    <AdminSidebar active="Certifications" />
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
      <SetupHeader certCode="" certName="New certification" step={1} totalSteps={5} stepLabel="Identify certification" />
      <div style={{ flex: 1, padding: '28px 40px', overflowY: 'auto' }}>
        <div style={{ maxWidth: 640 }}>
          <div style={{ fontSize: 13, color: T.tMuted, marginBottom: 24, lineHeight: 1.6 }}>
            Tell the setup agent which certification to build. It will search for the official exam guide and candidate handbook from these details in the next step.
          </div>

          <IdentityField label="Certification name" value="Certified Kubernetes Security Specialist" placeholder="e.g. Certified Kubernetes Security Specialist" />
          <div style={{ display: 'flex', gap: 16 }}>
            <div style={{ flex: 1 }}>
              <IdentityField label="Exam code" value="CKS" placeholder="e.g. CKS" mono hint="Shown across the app and used to de-duplicate." />
            </div>
            <div style={{ flex: 1.4 }}>
              <IdentityField label="Certifying body" value="CNCF / Linux Foundation" placeholder="e.g. Amazon Web Services" />
            </div>
          </div>
          <IdentityField label="Known source URL" placeholder="https://…" optional mono
            hint="Paste the official exam-guide URL if you have one. Otherwise the agent searches for candidate sources in the next step." />

          {/* What happens next */}
          <div style={{ display: 'flex', gap: 10, padding: '12px 14px', background: 'rgba(124,140,248,0.06)', border: '1px solid rgba(124,140,248,0.18)', borderRadius: T.rLg, marginTop: 4 }}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--readion-accent-label)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, marginTop: 1 }}><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <div style={{ fontSize: 12, color: T.tSecond, lineHeight: 1.6 }}>
              Next, the agent searches official sources for <strong style={{ color: T.tPrimary }}>CKS</strong> and returns ranked candidates for you to confirm — no metadata is created until you approve a source.
            </div>
          </div>

          <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 28, paddingTop: 20, borderTop: '1px solid ' + T.border }}>
            <button style={{ padding: '8px 18px', background: 'transparent', border: '1px solid ' + T.border, borderRadius: T.rMd, fontSize: 13, color: T.tSecond, cursor: 'pointer' }}>Cancel</button>
            <button style={{ padding: '8px 20px', background: T.primary, color: '#fff', border: 'none', borderRadius: T.rMd, fontSize: 13, fontWeight: 500, cursor: 'pointer' }}>
              Search for sources &#8594;
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
);

// ── Step 2: Source search & confirmation ──────────────────────────────────────
const SourceResult = ({ url, title, type, updated, confidence, selected, alt }) => (
  <div style={{ padding: '14px 16px', background: selected ? 'rgba(29,78,216,0.08)' : T.elevated, border: '1px solid ' + (selected ? T.primary : T.border), borderRadius: T.rLg, marginBottom: 8, cursor: 'pointer' }}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 6 }}>
      <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
        {selected && (
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" fill="var(--readion-primary)"/><path d="M5 8l2 2 4-4" stroke="#fff" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
        )}
        <span style={{ fontSize: 13, fontWeight: selected ? 500 : 400, color: selected ? T.tPrimary : T.tSecond }}>{title}</span>
      </div>
      <div style={{ display: 'flex', gap: 6, flexShrink: 0, marginLeft: 12 }}>
        <span style={{ fontSize: 10, padding: '2px 7px', background: T.surface, border: '1px solid ' + T.border, borderRadius: T.rFull, color: T.tMuted }}>{type}</span>
        {confidence && <span style={{ fontSize: 10, padding: '2px 7px', background: 'rgba(52,211,153,0.1)', border: '1px solid rgba(52,211,153,0.2)', borderRadius: T.rFull, color: T.good }}>{confidence} confidence</span>}
      </div>
    </div>
    <div style={{ fontSize: 11, color: T.accent, marginBottom: 4, fontFamily: 'var(--readion-font-mono)', wordBreak: 'break-all' }}>{url}</div>
    {updated && <div style={{ fontSize: 11, color: T.tSubtle }}>Last updated: {updated}</div>}
    {alt && <div style={{ fontSize: 11, color: T.tMuted, marginTop: 4, fontStyle: 'italic' }}>{alt}</div>}
  </div>
);

const SourceConfirmationScreen = () => (
  <div style={{ display: 'flex', fontFamily: 'Inter, ui-sans-serif, system-ui', background: T.base, height: '100%' }}>
    <AdminSidebar active="Certifications" />
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
      <SetupHeader certCode="CKS" certName="Certified Kubernetes Security Specialist" step={2} totalSteps={5} stepLabel="Source confirmation" />
      <div style={{ flex: 1, padding: '28px 40px', overflowY: 'auto' }}>
        <div style={{ maxWidth: 640 }}>
          <div style={{ fontSize: 13, color: T.tMuted, marginBottom: 20, lineHeight: 1.6 }}>
            The setup agent searched for the official CKS exam guide and candidate handbook. Confirm the primary source before field extraction begins.
          </div>

          {/* Agent status */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 14px', background: 'rgba(52,211,153,0.06)', border: '1px solid rgba(52,211,153,0.18)', borderRadius: T.rLg, marginBottom: 20 }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--readion-status-good)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            <span style={{ fontSize: 12, color: T.good }}>Found 3 candidate sources. Official handbook identified with high confidence.</span>
          </div>

          <div style={{ fontSize: 11, letterSpacing: '0.08em', textTransform: 'uppercase', color: T.tMuted, marginBottom: 10 }}>Select primary source</div>

          <SourceResult
            selected={true}
            title="CKS Candidate Handbook — CNCF"
            url="https://training.linuxfoundation.org/certification/certified-kubernetes-security-specialist/"
            type="Web page + linked PDF"
            updated="March 2024"
            confidence="High"
          />
          <SourceResult
            title="CKS Exam Curriculum (GitHub)"
            url="https://github.com/cncf/curriculum/blob/master/CKS_Curriculum.pdf"
            type="PDF"
            updated="February 2024"
            confidence="Medium"
            alt="Curriculum only — no cost/duration/passing score data"
          />
          <SourceResult
            title="Linux Foundation Training FAQ"
            url="https://training.linuxfoundation.org/about/faqs/"
            type="Web page"
            updated="Unknown"
            alt="May contain cost data but not exam-specific"
          />

          {/* Manual URL input */}
          <div style={{ marginTop: 16, padding: '12px 14px', background: T.surface, border: '1px solid ' + T.border, borderRadius: T.rLg }}>
            <div style={{ fontSize: 11, color: T.tMuted, marginBottom: 8 }}>Or enter a URL manually</div>
            <div style={{ display: 'flex', gap: 8 }}>
              <input readOnly defaultValue="" placeholder="https://..." style={{ flex: 1, background: T.base, border: '1px solid ' + T.border, borderRadius: T.rMd, padding: '7px 10px', fontSize: 13, color: T.tPrimary, fontFamily: 'var(--readion-font-mono)', outline: 'none' }} />
              <button style={{ padding: '7px 14px', background: T.surface, border: '1px solid ' + T.border, borderRadius: T.rMd, fontSize: 12, color: T.tSecond, cursor: 'pointer', whiteSpace: 'nowrap' }}>Verify</button>
            </div>
          </div>

          <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 28, paddingTop: 20, borderTop: '1px solid ' + T.border }}>
            <button style={{ padding: '8px 18px', background: 'transparent', border: '1px solid ' + T.border, borderRadius: T.rMd, fontSize: 13, color: T.tSecond, cursor: 'pointer' }}>Cancel</button>
            <button style={{ padding: '8px 20px', background: T.primary, color: '#fff', border: 'none', borderRadius: T.rMd, fontSize: 13, fontWeight: 500, cursor: 'pointer' }}>
              Confirm source &amp; extract fields &#8594;
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
);

// ── Step 2: Field extraction with citation panel ───────────────────────────────

const STATUS = {
  confirmed:  { label: 'Confirmed',  color: T.good, bg: 'rgba(52,211,153,0.1)',   border: 'rgba(52,211,153,0.2)' },
  unverified: { label: 'Unverified', color: T.warn, bg: 'rgba(251,146,60,0.1)',  border: 'rgba(251,146,60,0.2)' },
  pending:    { label: 'Pending',    color: T.tSubtle, bg: T.elevated, border: T.border },
};

const StatusBadge = ({ status }) => {
  const s = STATUS[status] || STATUS.pending;
  return (
    <span style={{ fontSize: 10, letterSpacing: '0.06em', textTransform: 'uppercase', padding: '2px 7px', background: s.bg, border: '1px solid ' + s.border, borderRadius: T.rFull, color: s.color, whiteSpace: 'nowrap' }}>
      {s.label}
    </span>
  );
};

const FIELDS = [
  { id: 'code',     label: 'Exam code',        value: 'CKS',                               status: 'confirmed'  },
  { id: 'fullname', label: 'Full name',         value: 'Certified Kubernetes Security Spec.', status: 'confirmed'  },
  { id: 'vendor',   label: 'Certifying body',   value: 'CNCF / Linux Foundation',            status: 'confirmed'  },
  { id: 'duration', label: 'Duration',          value: '2 hours',                            status: 'confirmed'  },
  { id: 'format',   label: 'Format',            value: 'Performance-based (live cluster)',    status: 'confirmed',   selected: true },
  { id: 'passing',  label: 'Passing score',     value: '67%',                                status: 'confirmed'  },
  { id: 'prereq',   label: 'Prerequisite',      value: 'CKA required',                       status: 'confirmed'  },
  { id: 'validity', label: 'Certification valid', value: '2 years',                          status: 'confirmed'  },
  { id: 'qcount',   label: 'Question count',    value: '~15–20 performance tasks',           status: 'unverified' },
  { id: 'cost',     label: 'Exam cost',         value: '$395 USD',                           status: 'unverified' },
  { id: 'domains',  label: 'Exam domains',      value: '5 domains (partial)',                status: 'pending'    },
];

const FieldExtractionScreen = () => (
  <div style={{ display: 'flex', fontFamily: 'Inter, ui-sans-serif, system-ui', background: T.base, height: '100%' }}>
    <AdminSidebar active="Certifications" />
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
      <SetupHeader certCode="CKS" certName="Certified Kubernetes Security Specialist" step={3} totalSteps={5} stepLabel="Field review" />

      {/* Summary strip */}
      <div style={{ borderBottom: '1px solid ' + T.border, padding: '8px 28px', background: T.surface, display: 'flex', gap: 20, flexShrink: 0 }}>
        {[['8', 'confirmed', T.good], ['2', 'unverified', T.warn], ['1', 'pending', T.tSubtle]].map(([n, l, c]) => (
          <div key={l} style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 12 }}>
            <span style={{ fontWeight: 600, color: c }}>{n}</span>
            <span style={{ color: T.tMuted }}>{l}</span>
          </div>
        ))}
        <div style={{ flex: 1 }} />
        <span style={{ fontSize: 12, color: T.tMuted }}>Source: training.linuxfoundation.org &middot; March 2024</span>
      </div>

      <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
        {/* Left: field list */}
        <div style={{ width: 310, flexShrink: 0, borderRight: '1px solid ' + T.border, overflowY: 'auto', background: T.elevated }}>
          {FIELDS.map((f) => (
            <div key={f.id} style={{ padding: '10px 16px', borderBottom: '1px solid ' + T.borderDef, background: f.selected ? 'rgba(29,78,216,0.1)' : 'transparent', borderLeft: '3px solid ' + (f.selected ? T.primary : 'transparent'), cursor: 'pointer' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8 }}>
                <div style={{ minWidth: 0, flex: 1 }}>
                  <div style={{ fontSize: 10, letterSpacing: '0.06em', textTransform: 'uppercase', color: f.selected ? T.accent : T.tSubtle, marginBottom: 3 }}>{f.label}</div>
                  <div style={{ fontSize: 13, color: f.selected ? T.tPrimary : T.tSecond, fontWeight: f.selected ? 500 : 400, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.value}</div>
                </div>
                <div style={{ flexShrink: 0, marginTop: 2 }}>
                  {f.status === 'confirmed'  && <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" fill="rgba(52,211,153,0.15)" stroke="var(--readion-status-good)" strokeWidth="1.2"/><path d="M5 8l2 2 4-4" stroke="var(--readion-status-good)" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                  {f.status === 'unverified' && <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" fill="rgba(251,146,60,0.12)" stroke="var(--readion-status-warning)" strokeWidth="1.2"/><path d="M8 5v4M8 11h.01" stroke="var(--readion-status-warning)" strokeWidth="1.4" strokeLinecap="round"/></svg>}
                  {f.status === 'pending'    && <div style={{ width: 14, height: 14, borderRadius: '50%', border: '1.5px solid ' + T.border, marginTop: 0 }} />}
                </div>
              </div>
            </div>
          ))}
        </div>

        {/* Right: citation panel for selected field (Format) */}
        <div style={{ flex: 1, overflowY: 'auto', padding: '24px 28px', display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div>
            <div style={{ fontSize: 10, letterSpacing: '0.09em', textTransform: 'uppercase', color: T.accent, marginBottom: 6 }}>Reviewing field</div>
            <div style={{ fontSize: 18, fontWeight: 600, color: T.tPrimary, marginBottom: 4 }}>Format</div>
            <StatusBadge status="confirmed" />
          </div>

          {/* Extracted value */}
          <div style={{ background: T.surface, border: '1px solid ' + T.border, borderRadius: T.rXl, padding: '16px 18px' }}>
            <div style={{ fontSize: 10, letterSpacing: '0.07em', textTransform: 'uppercase', color: T.tMuted, marginBottom: 8 }}>Extracted value</div>
            <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
              <input readOnly defaultValue="Performance-based (live cluster tasks)" style={{ flex: 1, background: T.base, border: '1px solid ' + T.border, borderRadius: T.rMd, padding: '7px 10px', fontSize: 14, color: T.tPrimary, fontFamily: 'inherit', outline: 'none' }} />
              <button style={{ padding: '7px 12px', background: 'transparent', border: '1px solid ' + T.border, borderRadius: T.rMd, fontSize: 12, color: T.tSecond, cursor: 'pointer' }}>Edit</button>
            </div>
          </div>

          {/* Source passage */}
          <div style={{ background: T.surface, border: '1px solid ' + T.border, borderRadius: T.rXl, padding: '16px 18px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
              <div style={{ fontSize: 10, letterSpacing: '0.07em', textTransform: 'uppercase', color: T.tMuted }}>Source passage</div>
              <div style={{ display: 'flex', align: 'center', gap: 8 }}>
                <span style={{ fontSize: 10, color: T.tSubtle, fontFamily: 'var(--readion-font-mono)' }}>training.linuxfoundation.org</span>
                <span style={{ fontSize: 10, color: T.tSubtle }}>p. 3</span>
              </div>
            </div>

            {/* Blockquote with highlight */}

const CoverageBar = ({ label, current, target, unit }) => {
  const pct = Math.min((current / target) * 100, 100);
  const color = pct >= 100 ? T.good : pct >= 70 ? T.medium : T.warn;
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 }}>
        <span style={{ fontSize: 12, color: T.tSecond }}>{label}</span>
        <span style={{ fontSize: 11, color: T.tMuted, fontFamily: 'var(--readion-font-mono)' }}>
          {current.toLocaleString()} / {target.toLocaleString()} {unit}
        </span>
      </div>
      <div style={{ height: 6, background: T.border, borderRadius: 4, position: 'relative' }}>
        <div style={{ height: '100%', width: pct + '%', background: color, borderRadius: 4, transition: 'width 0.3s' }} />
        {/* Go-live threshold marker */}
        <div style={{ position: 'absolute', top: -4, left: '80%', width: 1, height: 14, background: T.accent, opacity: 0.6 }} />
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 4 }}>
        <span style={{ fontSize: 10, color: color }}>{Math.round(pct)}% of target</span>
        <span style={{ fontSize: 10, color: T.tSubtle }}>Go-live threshold: 80%</span>
      </div>
    </div>
  );
};

                <button style={{ width: '100%', padding: '10px', background: T.primary, color: '#fff', border: 'none', borderRadius: T.rMd, fontSize: 13, fontWeight: 500, cursor: 'pointer', marginBottom: 8 }}>Publish certification</button>
                <button style={{ width: '100%', padding: '9px', background: 'transparent', border: '1px solid ' + T.border, borderRadius: T.rMd, fontSize: 13, color: T.tSecond, cursor: 'pointer' }}>Save as draft</button>
                <div style={{ fontSize: 11, color: T.tSubtle, lineHeight: 1.5, marginTop: 10 }}>Unverified fields stay hidden from learners until confirmed. You can publish now and resolve them later.</div>
              </div>
            </div>
          </div>

          <div style={{ display: 'flex', justifyContent: 'flex-start', marginTop: 24, paddingTop: 20, borderTop: '1px solid ' + T.border }}>
            <button style={{ padding: '8px 16px', background: 'transparent', border: '1px solid ' + T.border, borderRadius: T.rMd, fontSize: 13, color: T.tSecond, cursor: 'pointer' }}>&#8592; Back to content sources</button>
          </div>
        </div>
      </div>
    </div>
  );
};

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  return (
    <Canvas>
      <CanvasSection
        title="Admin — Certification Setup"
        subtitle="Five-step flow. Identify the certification, confirm the agent-found source, review extracted fields with per-field citations, ingest content against the go-live threshold, then a final review & publish gate. Plus stale-cert re-verification diff."
      >
        <Artboard screen="Cert setup wizard" state="step-1-identify" route="/admin/certifications/new" width={1050} height={780}>
          <IdentifyCertScreen />
        </Artboard>
        <Artboard screen="Cert setup wizard" state="step-2-source-confirmation" route="/admin/certifications/new" width={1050} height={780}>
          <SourceConfirmationScreen />
        </Artboard>
        <Artboard screen="Cert setup wizard" state="step-3-field-extraction" route="/admin/certifications/new" width={1050} height={780}>
          <FieldExtractionScreen />
        </Artboard>
        <Artboard screen="Cert setup wizard" state="step-4-content-sources" route="/admin/certifications/new" width={1050} height={780}>
          <ContentSourcesScreen />
        </Artboard>
        <Artboard screen="Cert setup wizard" state="step-5-review-publish" route="/admin/certifications/new" width={1050} height={780}>
          <ReviewPublishScreen />
        </Artboard>
        <Artboard screen="Cert re-verification" state="stale-diff" route="/admin/certifications/:code/re-verify" width={1050} height={780}>
          <StaleRecertScreen />
        </Artboard>
      </CanvasSection>
    </Canvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
