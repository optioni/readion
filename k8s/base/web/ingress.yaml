# Controller-agnostic Ingress — no ingressClassName is set here so the
# cluster's default IngressClass is used. If the target cluster has no
# default IngressClass, set `spec.ingressClassName` in an overlay (e.g.
# "nginx" or "traefik") rather than hard-coding one here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  labels:
    app: web
spec:
  tls:
    - hosts:
        - readion.example.com
      secretName: web-tls
  rules:
    - host: readion.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
