apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: web
          # OWNER/REPO placeholder — pinned to a real ghcr.io/<repo>/web digest
          # by Image Updater (see k8s/argocd/application.yaml, group 6).
          image: ghcr.io/OWNER/REPO/web:latest
          ports:
            - name: http
              containerPort: 3000
          # web needs only NODE_ENV + NUXT_PUBLIC_API_BASE_URL (both
          # non-secret, per design.md) — sourced per-key rather than via
          # envFrom so it doesn't pull in config meant for api/worker, and
          # so it never references the readion-secret Secret it has no use
          # for.
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: readion-config
                  key: NODE_ENV
            - name: NUXT_PUBLIC_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: readion-config
                  key: NUXT_PUBLIC_API_BASE_URL
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
