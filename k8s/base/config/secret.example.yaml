# Example only — do NOT commit real secret material.
# Real values are supplied out-of-band (sealed-secrets / external-secrets /
# a cluster-managed secret store) before this is applied to a real cluster.
apiVersion: v1
kind: Secret
metadata:
  name: readion-secret
type: Opaque
stringData:
  REDIS_URL: "replace-me"
  JWT_SECRET: "replace-me"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  INTERNAL_API_SECRET: "replace-me"
  # api requires AI_API_KEY in production. AI_EMBEDDING_API_KEY is separate
  # because embeddings run on OpenAI while AI_PROVIDER is anthropic.
  AI_API_KEY: "replace-me"
  AI_EMBEDDING_API_KEY: "replace-me"
  SENTRY_DSN: ""
  # Cert source-discovery web search (Tavily). OPTIONAL everywhere, including
  # production: leave unset to keep the admin "discover sources" step inert but
  # healthy (returns no candidates, never errors). Set a real key to make
  # discovery live in this environment.
  TAVILY_API_KEY: ""
  # packages/db's MikroORM config connects via these discrete DB_* vars (see
  # mikro-orm.config.ts) — there is no DATABASE_URL. The api/worker env schemas
  # require them in production, so a boot fails fast if any are left unset
  # rather than silently falling back to the localhost dev defaults.
  DB_HOST: "replace-me"
  DB_PORT: "5432"
  DB_USER: "replace-me"
  DB_PASSWORD: "replace-me"
  DB_NAME: "replace-me"
