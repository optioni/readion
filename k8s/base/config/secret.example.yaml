# Example only — do NOT commit real secret material.
# Real values are supplied out-of-band (sealed-secrets / external-secrets /
# a cluster-managed secret store) before this is applied to a real cluster.
apiVersion: v1
kind: Secret
metadata:
  name: readion-secret
type: Opaque
stringData:
  DATABASE_URL: "replace-me"
  REDIS_URL: "replace-me"
  JWT_SECRET: "replace-me"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  INTERNAL_API_SECRET: "replace-me"
  SENTRY_DSN: ""
  # packages/db's MikroORM config connects via these discrete DB_* vars, NOT
  # DATABASE_URL (which is kept above only because the api env schema
  # requires it to be present). Without DB_*, app pods and the migration Job
  # would silently fall back to the localhost dev defaults in production.
  DB_HOST: "replace-me"
  DB_PORT: "5432"
  DB_USER: "replace-me"
  DB_PASSWORD: "replace-me"
  DB_NAME: "replace-me"
