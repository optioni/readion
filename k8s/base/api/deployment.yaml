apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3001"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          # OWNER/REPO placeholder — pinned to a real ghcr.io/<repo>/api digest
          # by Image Updater (see k8s/argocd/application.yaml, group 6).
          image: ghcr.io/OWNER/REPO/api:latest
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: readion-config
            - secretRef:
                name: readion-secret
          env:
            # Container env overrides envFrom — readion-config's base
            # SERVICE_NAME must be readion-api for this workload.
            - name: SERVICE_NAME
              value: readion-api
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
