name: PR Checks

on:
  pull_request:
    branches: [main]

# Supersede in-flight runs when a PR is pushed again, so a new commit doesn't
# leave the previous (now-stale) multi-minute Testcontainers run burning a slot.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn typecheck

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn format

  manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Self-contained: installs its own tooling rather than relying on
      # whatever happens to be preinstalled on the runner image, so this job
      # doesn't drift out from under k8s/validate.sh's documented versions.
      - name: Install kubectl (provides `kubectl kustomize`)
        run: |
          KUBECTL_VERSION="$(curl -L -s https://dl.k8s.io/release/stable.txt)"
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install kubeconform
        run: |
          curl -sL "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - name: Run manifest validation harness
        run: bash k8s/validate.sh

  # Fast lane: pure-logic (shared) + happy-dom (web) + root smoke tests. No
  # containers, so it finishes in ~1 min and acts as the gate for the slow
  # Testcontainers lane below. Building @readion/shared + @readion/db first
  # generates the `dist` that web's bundler resolves via each package's `main`.
  test-unit:
    name: Test (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build:packages
      - run: yarn test:unit

  # Slow lane: api/worker/db integration + acceptance tests, each spinning up
  # Postgres + Redis via Testcontainers. Gated behind the cheap checks so a
  # type error or broken unit test fails the PR in ~1 min instead of after the
  # full multi-minute container run.
  test-integration:
    name: Test (integration + acceptance)
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test-unit]
    services:
      docker:
        image: docker:dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
        options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn test:integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
