name: Build & Push Images

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on:
        group: arm-runners
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # One metadata call per image generates a bake override file carrying that
      # image's tags/labels, merged onto docker-bake.hcl at build time.
      - name: Metadata (api)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          bake-target: api

      - name: Metadata (worker)
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/worker
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          bake-target: worker

      - name: Metadata (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          bake-target: web

      # Builds api/worker/web in one invocation so base/deps/packages-build
      # compile once and are shared across targets; per-image registry cache
      # (:buildcache) persists layers across runs.
      - name: Build & push all images
        uses: docker/bake-action@v6
        with:
          files: |
            ./docker-bake.hcl
            ${{ steps.meta-api.outputs.bake-file }}
            ${{ steps.meta-worker.outputs.bake-file }}
            ${{ steps.meta-web.outputs.bake-file }}
          push: true
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          SENTRY_RELEASE: ${{ github.sha }}

  upload-sourcemaps:
    name: Upload source maps to Sentry
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN_SET: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.SENTRY_AUTH_TOKEN_SET == 'true'

      - uses: actions/setup-node@v4
        if: env.SENTRY_AUTH_TOKEN_SET == 'true'
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: corepack enable
        if: env.SENTRY_AUTH_TOKEN_SET == 'true'
      - run: yarn install --frozen-lockfile
        if: env.SENTRY_AUTH_TOKEN_SET == 'true'
      - run: yarn workspace @readion/api build
        if: env.SENTRY_AUTH_TOKEN_SET == 'true'
      - run: yarn workspace @readion/worker build
        if: env.SENTRY_AUTH_TOKEN_SET == 'true'

      - name: Create Sentry release
        if: env.SENTRY_AUTH_TOKEN_SET == 'true'
        run: npx @sentry/cli@latest releases new "${{ github.sha }}"

      - name: Upload api source maps
        if: env.SENTRY_AUTH_TOKEN_SET == 'true'
        run: npx @sentry/cli@latest releases files "${{ github.sha }}" upload-sourcemaps apps/api/dist --url-prefix "~/"

      - name: Upload worker source maps
        if: env.SENTRY_AUTH_TOKEN_SET == 'true'
        run: npx @sentry/cli@latest releases files "${{ github.sha }}" upload-sourcemaps apps/worker/dist --url-prefix "~/"

      - name: Finalize Sentry release
        if: env.SENTRY_AUTH_TOKEN_SET == 'true'
        run: npx @sentry/cli@latest releases finalize "${{ github.sha }}"
